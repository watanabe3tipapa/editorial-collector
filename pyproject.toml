[project]
name = "editorial-collector"
version = "0.1.0"
description = "日本の主要新聞の社説を無料公開範囲で収集するツール（marimo UI / CLI）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "watanabe3tipapa" }]
keywords = ["newspaper", "editorial", "scraper", "marimo", "cloudflare"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "marimo>=0.13",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
editorial-collector = "editorial_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["editorial_collector"]

[tool.marimo.save]
format_on_save = false

[tool.marimo.display]
cell_output = "below"
